<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilingual Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Assistant', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 90%;
            max-width: 650px;
            position: relative;
        }
        .lang-link {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #d93025;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .hidden { display: none; }
        h1 { color: #2c3e50; }
        p { color: #34495e; line-height: 1.8; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="container">
        <div id="he-page">
            <a href="#" class="lang-link" onclick="toggle('en')">English</a>
            <h1>כותרת בעברית</h1>
            <p>הכנס את הטקסט שלך כאן. העברית מיושרת לימין בצורה תקינה.</p>
        </div>

        <div id="en-page" class="hidden">
            <a href="#" class="lang-link" onclick="toggle('he')">עברית</a>
            <div dir="ltr">
                <h1>English Title</h1>
                <p>Enter your English text here. The layout will switch to left-to-right automatically.</p>
            </div>
        </div>
    </div>

    <script>
        function toggle(lang) {
            document.getElementById('he-page').classList.toggle('hidden');
            document.getElementById('en-page').classList.toggle('hidden');
            document.documentElement.dir = (lang === 'he') ? 'rtl' : 'ltr';
        }
    </script>
</body>
</html>
